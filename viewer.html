const MODAL = {
  editingId: null,   // 若非 null 表示編輯現有項目
  category: 'shop'
};
function openModal(editingId, defaultCat) {
  MODAL.editingId = editingId || null;
  const backdrop = document.getElementById('modal-backdrop');
  const title = document.getElementById('modal-title');
  const catButtons = document.querySelectorAll('#modal .cat-picker button');
  const zh = document.getElementById('item-name-zh');
  const ja = document.getElementById('item-name-ja');
  const en = document.getElementById('item-name-en');
  const note = document.getElementById('item-note');
  const typeInp = document.getElementById('item-type');
  const durInp = document.getElementById('item-duration');
  const rainInp = document.getElementById('item-rain');
  const thrillInp = document.getElementById('item-thrill');
  const catPicker = document.getElementById('modal-cat-picker');
  const nameFields = document.getElementById('modal-name-fields');
  const attrFields = document.getElementById('modal-attr-fields');
  const resetBtn = document.getElementById('modal-reset');

  // 判斷編輯什麼: 硬編設施 vs 使用者項目
  const facility = editingId ? FACILITIES.find(f => f.id === editingId) : null;
  const userIt = editingId ? STATE.userItems.find(u => u.id === editingId) : null;
  MODAL.isAttraction = !!facility;

  if (facility) {
    // 編輯硬編設施 — 只顯示詳情欄位
    title.textContent = '🔧 編輯詳情 · ' + facility.zh;
    catPicker.style.display = 'none';
    nameFields.style.display = 'none';
    attrFields.style.display = '';
    resetBtn.style.display = '';
    typeInp.value = itemField(facility, 'type') || '';
    durInp.value = itemField(facility, 'duration') || '';
    const passArr = itemField(facility, 'pass') || [];
    ['dpa','pp','er'].forEach(p => {
      document.getElementById('item-pass-' + p).checked = passArr.includes(p);
    });
    rainInp.checked = !!itemField(facility, 'rain');
    thrillInp.checked = !!itemField(facility, 'thrill');
    note.value = itemNote(facility);
    MODAL.category = 'attraction';
  } else if (userIt) {
    // 編輯使用者項目 (shop/dining/transit)
    title.textContent = '✏️ 編輯項目';
    catPicker.style.display = '';
    nameFields.style.display = '';
    attrFields.style.display = 'none';
    resetBtn.style.display = 'none';
    MODAL.category = userIt.category;
    zh.value = userIt.zh || ''; ja.value = userIt.ja || ''; en.value = userIt.en || '';
    note.value = itemNote(userIt);
  } else {
    // 新增
    title.textContent = '➕ 新增項目';
    catPicker.style.display = '';
    nameFields.style.display = '';
    attrFields.style.display = 'none';
    resetBtn.style.display = 'none';
    MODAL.category = defaultCat || (STATE.view === OVERVIEW_ID ? 'transit' : 'shop');
    zh.value = ''; ja.value = ''; en.value = ''; note.value = '';
  }
  catButtons.forEach(b => b.classList.toggle('on', b.dataset.cat === MODAL.category));
  updateModalSave();
  backdrop.classList.add('show');
  if (facility) typeInp.focus(); else zh.focus();
}
function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('show');
}
function updateModalSave() {
  const btn = document.getElementById('modal-save');
  if (MODAL.isAttraction) {
    btn.disabled = false;   // 設施編輯任何欄位都可儲存
  } else {
    const zh = document.getElementById('item-name-zh').value.trim();
    btn.disabled = !zh;
  }
}
function saveModalItem() {
  const note = document.getElementById('item-note').value;
  // 硬編設施編輯 → 存到 itemOverrides
  if (MODAL.isAttraction && MODAL.editingId) {
    const type = document.getElementById('item-type').value.trim();
    const duration = document.getElementById('item-duration').value.trim();
    const pass = ['dpa','pp','er'].filter(p => document.getElementById('item-pass-' + p).checked);
    const rain = document.getElementById('item-rain').checked;
    const thrill = document.getElementById('item-thrill').checked;
    STATE.itemOverrides[MODAL.editingId] = { type, duration, pass, rain, thrill };
    // 備註同步存到 itemNotes
    const origNote = FACILITIES.find(f => f.id === MODAL.editingId)?.note || '';
    if (!note.trim() || note.trim() === origNote) delete STATE.itemNotes[MODAL.editingId];
    else STATE.itemNotes[MODAL.editingId] = note.trim();
    saveData();
    closeModal();
    refreshLayers();
    renderList();
    // 若面板顯示這項，重新渲染
    const sheet = document.getElementById('detail-sheet');
    if (sheet.classList.contains('show') && STATE.selectedId === MODAL.editingId) {
      const it = FACILITIES.find(f => f.id === MODAL.editingId);
      document.getElementById('sheet-body').innerHTML = sheetHtml(it);
      hydrateSheet(it);
    }
    return;
  }

  const zh = document.getElementById('item-name-zh').value.trim();
  if (!zh) return;
  const ja = document.getElementById('item-name-ja').value.trim();
  const en = document.getElementById('item-name-en').value.trim();
  if (MODAL.editingId) {
    const it = STATE.userItems.find(u => u.id === MODAL.editingId);
    if (it) {
      it.category = MODAL.category; it.zh = zh; it.ja = ja; it.en = en; it.note = note.trim();
    }
    saveData();
    closeModal();
    refreshLayers();
    renderList();
  } else {
    // 新增：transit 只能在總覽; shop/dining 在該區域
    const region = MODAL.category === 'transit' ? OVERVIEW_ID : STATE.view;
    const item = {
      id: 'u' + Date.now() + Math.random().toString(36).slice(2, 6),
      category: MODAL.category,
      region,
      zh, ja, en, note
    };
    STATE.userItems.push(item);
    saveData();
    closeModal();
    // 進入放置模式，選擇這個新項目
    STATE.editMode = 'facility';
    STATE.selectedId = item.id;
    updateModeButtons();
    renderList();
    refreshLayers();
    updateStatus(`✅ 已新增「${zh}」→ 點地圖標記位置`);
  }
}

// ============================================================
// 按鈕 / 事件
// ============================================================
function updateModeButtons() {
  const bf = document.getElementById('btn-edit-facility');
  const bfOv = document.getElementById('btn-edit-facility-ov');
  const br = document.getElementById('btn-edit-route');
  const brOv = document.getElementById('btn-edit-route-ov');
  if (bf)   bf.classList.toggle('active', STATE.editMode === 'facility');
  if (bfOv) bfOv.classList.toggle('active', STATE.editMode === 'facility');
  if (br)   br.classList.toggle('active', STATE.editMode === 'route');
  if (brOv) brOv.classList.toggle('active', STATE.editMode === 'route');
}

function setMode(mode) {
  // 切換模式時清空繪製中的路線
  if (STATE.drawingRoute) { STATE.drawingRoute = null; STATE.drawingLayer && STATE.drawingLayer.clearLayers(); }
  STATE.editMode = STATE.editMode === mode ? 'off' : mode;
  STATE.selectedId = null;
  updateModeButtons();
  updateStatus();
  refreshLayers();
  renderList();
}

function exportData() {
  const json = JSON.stringify({ coords: STATE.coords, routes: STATE.routes }, null, 2);
  const win = window.open('', '_blank', 'width=700,height=600');
  win.document.write(`
    <html><head><title>資料匯出</title>
    <style>body{font-family:monospace;padding:20px;background:#f7f9fc;color:#1e293b;}
    textarea{width:100%;height:75%;background:#fff;color:#1e293b;border:1px solid #cbd5e1;padding:10px;border-radius:6px;font-family:monospace;font-size:12px;}
    button{background:#0077cc;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;margin-top:8px;font-size:13px;}
    p{color:#64748b;font-size:12px;}</style></head><body>
    <h3>座標 + 路線資料</h3>
    <p>複製後可以貼回主檔案的 localStorage["tds-data-v2"] 或用「📥 匯入」按鈕還原。</p>
    <textarea id="ta" readonly>${json}</textarea><br>
    <button onclick="document.getElementById('ta').select();document.execCommand('copy');this.textContent='✓ 已複製'">複製到剪貼簿</button>
    </body></html>
  `);
}
function importData() {
  const text = prompt('貼上完整資料 JSON:');
  if (!text) return;
  try {
    const obj = JSON.parse(text);
    STATE.coords = obj.coords || {};
    STATE.routes = obj.routes || {};
    saveData();
    refreshLayers();
    renderList();
    updateStatus('已匯入');
  } catch (e) {
    alert('JSON 格式錯誤: ' + e.message);
  }
}

function bindEvents() {
  // 過濾晶片 (事件委派)
  document.getElementById('sidebar').addEventListener('click', e => {
    const el = e.target.closest('.filter-chip');
    if (!el) return;
    const type = el.dataset.filter;
    const val = el.dataset.val;
    const set = STATE.filters[type];
    if (set.has(val)) { set.delete(val); el.classList.remove('on'); }
    else { set.add(val); el.classList.add('on'); }
    refreshLayers();
    renderList();
  });

  document.getElementById('search').addEventListener('input', e => {
    STATE.filters.search = e.target.value.trim();
    refreshLayers();
    renderList();
  });

  document.getElementById('btn-back').addEventListener('click', () => goToOverview());
  document.getElementById('title').addEventListener('click', () => goToOverview());

  // 分類 tabs
  document.getElementById('cat-tabs').addEventListener('click', e => {
    const tab = e.target.closest('.cat-tab');
    if (!tab) return;
    const cat = tab.dataset.cat;
    if (STATE.filters.cat.has(cat) && STATE.filters.cat.size === 1) return;
    if (STATE.filters.cat.has(cat)) { STATE.filters.cat.delete(cat); tab.classList.remove('on'); }
    else { STATE.filters.cat.add(cat); tab.classList.add('on'); }
    refreshLayers();
    renderList();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') hideDetailSheet();
  });

  window.closeSidebar = function() {
    if (isMobileView()) setSheetSnap('peek');
  };
  document.querySelector('#detail-sheet .sheet-close').addEventListener('click', hideDetailSheet);
}

// ============================================================
// 靜態 UI (chips + legend)
// ============================================================
function renderStaticUi() {
  const passRow = document.getElementById('chip-row-pass');
  ['dpa','pp','er'].forEach(k => {
    const chip = document.createElement('span');
    chip.className = `filter-chip ${k} on`;
    chip.dataset.filter = 'pass';
    chip.dataset.val = k;
    chip.title = `${k.toUpperCase()} · ${PASS_LABEL[k]}`;
    chip.innerHTML = `<span class="chip-icon">${PASS_ICONS[k]}</span>`;
    passRow.appendChild(chip);
  });

  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  ['dpa','pp','er'].forEach(k => {
    const row = document.createElement('div');
    row.className = 'row';
    row.title = PASS_LABEL[k];
    row.innerHTML = `<div class="legend-icon ${k}">${PASS_ICONS[k]}</div><b>${k.toUpperCase()}</b>`;
    legend.appendChild(row);
  });
}

// ============================================================
// 啟動
// ============================================================
function applyMode() {
  document.body.classList.toggle('mode-planning', STATE.mode === 'planning');
  const btn = document.getElementById('btn-mode');
  if (btn) btn.textContent = STATE.mode === 'planning' ? '⚙️ 規劃' : '🎡 觀光';
}

// ============================================================
// 手機底部面板 - 三段 snap (peek / half / full)
// ============================================================
function isMobileView() { return window.matchMedia('(max-width: 768px)').matches; }

function setSheetSnap(name) {
  const sidebar = document.getElementById('sidebar');
  sidebar.style.transform = '';
  sidebar.classList.remove('snap-half', 'snap-full');
  if (name === 'half') sidebar.classList.add('snap-half');
  else if (name === 'full') sidebar.classList.add('snap-full');
  STATE.sheetSnap = name;
}

function initBottomSheet() {
  const sidebar = document.getElementById('sidebar');
  const handle = sidebar.querySelector('.sheet-drag-handle');
  if (!handle) return;

  const snapPositions = () => {
    const vh = window.innerHeight;
    return { peek: vh - 80, half: vh * 0.5, full: vh * 0.1 };
  };
  const nearest = (currentTop) => {
    const p = snapPositions();
    let best = 'peek', bestDist = Infinity;
    for (const k in p) {
      const d = Math.abs(p[k] - currentTop);
      if (d < bestDist) { bestDist = d; best = k; }
    }
    return best;
  };

  let drag = null;

  handle.addEventListener('pointerdown', (e) => {
    if (!isMobileView()) return;
    drag = {
      startY: e.clientY,
      startTop: sidebar.getBoundingClientRect().top,
      moved: false,
      pointerId: e.pointerId
    };
    sidebar.classList.add('dragging');
    document.body.classList.add('no-select');
    try { handle.setPointerCapture(e.pointerId); } catch {}
  });

  handle.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dy = e.clientY - drag.startY;
    if (Math.abs(dy) > 4) drag.moved = true;
    const vh = window.innerHeight;
    const newTop = Math.max(vh * 0.1, Math.min(vh - 60, drag.startTop + dy));
    // 直接用 transform 對應 top
    sidebar.style.transform = `translateY(${newTop}px)`;
  });

  const endDrag = (e) => {
    if (!drag) return;
    sidebar.classList.remove('dragging');
    document.body.classList.remove('no-select');
    const currentTop = sidebar.getBoundingClientRect().top;
    if (drag.moved) {
      setSheetSnap(nearest(currentTop));
    } else {
      // Tap → 循環
      const order = ['peek', 'half', 'full'];
      const idx = order.indexOf(STATE.sheetSnap);
      setSheetSnap(order[(idx + 1) % order.length]);
    }
    drag = null;
  };
  handle.addEventListener('pointerup', endDrag);
  handle.addEventListener('pointercancel', endDrag);

  // 視窗尺寸變化：重設 sheet 位置避免跑掉
  window.addEventListener('resize', () => {
    if (isMobileView()) setSheetSnap(STATE.sheetSnap);
    else { sidebar.style.transform = ''; sidebar.classList.remove('snap-half', 'snap-full'); }
  });

  // 初始 peek
  if (isMobileView()) setSheetSnap('peek');
}

async function bootstrap() {
  loadData();
  STATE.mode = 'tourist';        // 觀看版永遠鎖定觀光模式
  renderStaticUi();
  bindEvents();
  initBottomSheet();
  updateViewChrome();
  renderList();
  // 支援 URL hash 直接跳區域 (例:#/region/mediterranean)
  const hash = location.hash.slice(1);
  const m = hash.match(/^\/region\/(.+)$/);
  if (m && REGIONS[m[1]]) {
    STATE.view = m[1];
    updateViewChrome();
    renderList();
  }
  await loadCurrentView();
  // 導航變化時更新 hash
  window.addEventListener('hashchange', () => {
    const h = location.hash.slice(1);
    const mm = h.match(/^\/region\/(.+)$/);
    if (mm && REGIONS[mm[1]] && STATE.view !== mm[1]) goToRegion(mm[1]);
    else if (!mm && STATE.view !== OVERVIEW_ID) goToOverview();
  });
}
bootstrap();
</script>
